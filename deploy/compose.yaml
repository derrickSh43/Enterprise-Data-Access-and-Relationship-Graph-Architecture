services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: eda
      POSTGRES_USER: eda
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U eda"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      EDA_DATABASE_URL: postgresql+psycopg2://eda:local-demo-only@database:5432/eda
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      database:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      EDA_ENV: dev
      EDA_AUTH_MODE: dev
      EDA_DATABASE_URL: postgresql+psycopg2://eda:local-demo-only@database:5432/eda
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - evidence:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  database:
  evidence:
