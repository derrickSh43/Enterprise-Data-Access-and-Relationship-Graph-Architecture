name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c beta/constraints-tested.txt -e "./beta[dev,aws,entra,postgres]"
      - run: python -m pytest --tb=short
        working-directory: beta
  terraform:
    strategy:
      matrix:
        directory: [infra/platform, sandbox/aws, sandbox/entra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.3'
      - run: terraform fmt -check -recursive infra
      - run: terraform fmt -check -recursive sandbox
      - run: terraform -chdir=${{ matrix.directory }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.directory }} validate
      - run: terraform -chdir=${{ matrix.directory }} test
